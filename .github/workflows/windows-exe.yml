# Builds the Android app (FaceAttend.apk) and the Windows desktop app (Setup.exe + portable zip,
# with the APK inside so phones can download it from the PC), tests both and uploads the files.
# Download: GitHub > Actions > "Build apps" > latest run > Artifacts.
# Pushing a tag like v1.0.0 also attaches the files to a GitHub Release.
name: Build apps

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      research_antispoof:
        description: "Bundle the NON-COMMERCIAL research anti-spoofing model (academic builds only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version and signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${{ github.ref_name }}"; v="${v#v}"; else v="0.0.${{ github.run_number }}"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "UPDATE_REPO=${{ github.repository }}" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_B64" ]; then          # private key from repository secrets (recommended for selling)
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "using the private signing key"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - signing with the public demo key (android/keystore)"
          fi
      - name: Build APK
        env:
          FACEATTEND_CLOUD_URL: ${{ vars.FACEATTEND_CLOUD_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk ../dist/FaceAttend.apk
          echo "version $APP_VERSION (code $APP_VERSION_CODE), signing certificate:"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs ../dist/FaceAttend.apk | grep -E "DN|SHA-256" || true
      - name: Lint
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FaceAttend-android
          path: dist/FaceAttend.apk
          if-no-files-found: error
      - name: Publish APK to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FaceAttend.apk
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  build:
    needs: android
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-desktop.txt

      - name: Run tests
        env:
          VISION_BACKEND: fake
        run: python -m pytest -q

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - uses: actions/download-artifact@v4
        with:
          name: FaceAttend-android
          path: dist

      - name: Build
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
        shell: pwsh
        run: |
          if ("${{ inputs.research_antispoof }}" -eq "true") { python packaging/build_exe.py --include-research-antispoof }
          else { python packaging/build_exe.py }

      - name: Smoke test the .exe
        shell: pwsh
        run: |
          # stand-in for the app window: opens and closes immediately
          Set-Content -Path window.bat -Value "@exit 0"
          $env:FACEATTEND_BROWSER = "$PWD\window.bat"
          $env:DATA_DIR = "$env:RUNNER_TEMP\faceattend-data"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          # (Start-Process -Wait would also wait for the background server it leaves running)
          $launcher = Start-Process -FilePath "dist\FaceAttend\FaceAttend.exe" -PassThru
          if (-not $launcher.WaitForExit(120000)) { throw "launcher did not finish" }
          Write-Host "launcher finished after $($sw.Elapsed.TotalSeconds) s (exit $($launcher.ExitCode))"
          if ($launcher.ExitCode -ne 0) { Get-Content "$env:DATA_DIR\logs\*.log" -ErrorAction SilentlyContinue; throw "launcher failed" }
          # the window has closed, but the background server must keep running
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/login -Method Post -WebSession $s -Body @{username="admin"; password="admin123"} | Out-Null
          foreach ($u in "/", "/settings", "/messages", "/reports/monthly?fmt=xlsx", "/reports/monthly?fmt=pdf", "/mobile", "/download/android") {
            $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8000$u" -WebSession $s
            Write-Host "$u -> $($r.StatusCode)"
            if ($r.StatusCode -ne 200) { throw "$u failed" }
          }
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/ask -WebSession $s
          if ($r.StatusCode -ne 200) { throw "/ask failed" }
          if (-not (Test-Path "HKCU:\Software\Classes\faceattend\shell\open\command")) { throw "faceattend:// link not registered" }
          Write-Host "server still running after the window closed; faceattend:// registered"
          # a second launch reuses the running server
          $second = Start-Process -FilePath "dist\FaceAttend\FaceAttend.exe" -PassThru
          if (-not $second.WaitForExit(60000) -or $second.ExitCode -ne 0) { throw "second launch failed" }

          # share online: a real public https link through Cloudflare (needs a non-default admin password)
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/account/password -Method Post -WebSession $s -Body @{current="admin123"; new="ci-strong-password-1"; confirm="ci-strong-password-1"} | Out-Null
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/share/start -Method Post -WebSession $s | Out-Null
          $url = $null
          for ($i = 0; $i -lt 90 -and -not $url; $i++) {
            Start-Sleep -Seconds 1
            $st = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/share/status -WebSession $s).Content | ConvertFrom-Json
            if ($st.error) { Write-Host "share error: $($st.error)"; break }
            $url = $st.url
          }
          if ($url) {
            Write-Host "online link: $url"
            $ok = $false
            for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
              Start-Sleep -Seconds 2
              try { $r = Invoke-WebRequest -UseBasicParsing "$url/login" -TimeoutSec 15; $ok = $r.StatusCode -eq 200 -and $r.Content -match "FaceAttend" } catch {}
            }
            if ($ok) { Write-Host "the app loads through the public link" } else { Write-Host "::warning::public link did not answer (Cloudflare quick tunnels are best-effort)" }
          } else { Write-Host "::warning::share online did not start on this runner" }

          # quit
          $q = Start-Process -FilePath "dist\FaceAttend\FaceAttend.exe" -ArgumentList "--quit" -PassThru
          $q.WaitForExit(60000) | Out-Null
          Start-Sleep -Seconds 2
          $stopped = $false
          try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/login -TimeoutSec 3 | Out-Null } catch { $stopped = $true }
          if (-not $stopped) { throw "--quit did not stop the server" }
          Write-Host "--quit stopped the server"

      - uses: actions/upload-artifact@v4
        with:
          name: FaceAttend-Setup
          path: dist/FaceAttend-Setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: FaceAttend-portable
          path: dist/FaceAttend-portable.zip
          if-no-files-found: error

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FaceAttend-Setup.exe
            dist/FaceAttend-portable.zip
            dist/FaceAttend.apk
