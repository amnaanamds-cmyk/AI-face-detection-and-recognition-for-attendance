{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">Create attendance session</h1>
{% if not courses %}<div class="alert alert-warning">You have no courses yet.</div>{% endif %}
<form method="post" class="card card-body" style="max-width: 720px">
  <div class="row g-3">
    <div class="col-12"><label class="form-label">Course</label>
      <select class="form-select" name="course_id" required>{% for c in courses %}<option value="{{ c.id }}" {{ 'selected' if c.id == course_id }}>{{ c.code }} — {{ c.name }} (Sem {{ c.semester }}{{ c.section }}{% if c.teacher %}, {{ c.teacher.full_name }}{% endif %})</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Date</label><input class="form-control" type="date" name="day" value="{{ today }}" required></div>
    <div class="col-md-4"><label class="form-label">Start time</label><input class="form-control" type="time" name="start" value="{{ now }}" required></div>
    <div class="col-md-4"><label class="form-label">Duration (min)</label><input class="form-control" type="number" name="duration" value="60" min="5"></div>
    <div class="col-md-6"><label class="form-label">Present if arriving within (min)</label><input class="form-control" type="number" name="present_window" value="{{ cfg.present_window_minutes }}" min="0"></div>
    <div class="col-md-6"><label class="form-label">Late if arriving within (min) — afterwards Absent</label><input class="form-control" type="number" name="late_window" value="{{ cfg.late_window_minutes }}" min="0"></div>
    <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="liveness" id="lv" {{ 'checked' if cfg.liveness_enabled }}>
      <label class="form-check-label" for="lv">Require liveness detection (reject photos / screens)</label></div></div>
  </div>
  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-success" name="start_now" value="1"><i class="bi bi-play-fill"></i> Create &amp; start attendance</button>
    <button class="btn btn-outline-primary">Create (schedule)</button>
  </div>
</form>
{% endblock %}
