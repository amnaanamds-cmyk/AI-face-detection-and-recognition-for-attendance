{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">{{ 'Edit course' if course else 'New course' }}</h1>
<form method="post" class="card card-body" style="max-width: 720px">
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label">Code *</label><input class="form-control" name="code" required placeholder="CS-401" value="{{ course.code if course else '' }}"></div>
    <div class="col-md-8"><label class="form-label">Name *</label><input class="form-control" name="name" required placeholder="Artificial Intelligence" value="{{ course.name if course else '' }}"></div>
    <div class="col-md-6"><label class="form-label">Department</label><input class="form-control" name="department" value="{{ course.department if course else 'Computer Science' }}"></div>
    <div class="col-md-3"><label class="form-label">Semester</label><input class="form-control" type="number" min="1" name="semester" value="{{ course.semester if course else 1 }}"></div>
    <div class="col-md-3"><label class="form-label">Section</label><input class="form-control" name="section" value="{{ course.section if course else 'A' }}"></div>
    <div class="col-md-6"><label class="form-label">Teacher</label>
      <select class="form-select" name="teacher_id"><option value="0">— none —</option>
      {% for t in teachers %}<option value="{{ t.id }}" {{ 'selected' if course and course.teacher_id == t.id }}>{{ t.full_name }}</option>{% endfor %}</select>
      <div class="form-text">Add teachers under Admin → Users.</div></div>
    {% if not course %}<div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="enroll_matching" id="em" checked>
      <label class="form-check-label" for="em">Enroll all students of this department / semester / section</label></div></div>{% endif %}
  </div>
  <div class="mt-4"><button class="btn btn-primary">Save</button> <a class="btn btn-link" href="/courses">Cancel</a></div>
</form>
{% endblock %}
