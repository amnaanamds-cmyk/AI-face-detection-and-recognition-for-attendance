{% extends "base.html" %}
{% block title %}Login - {{ app_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-person-bounding-box display-4 text-primary"></i>
          <h1 class="h4 mt-2">{{ app_name }}</h1>
          <p class="text-muted small mb-0">AI face recognition &amp; liveness-based attendance</p>
        </div>
        {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
        <form method="post" action="/login">
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required autofocus></div>
          <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
          <button class="btn btn-primary w-100">Sign in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
