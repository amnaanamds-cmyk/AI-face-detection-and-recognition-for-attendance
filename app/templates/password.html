{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<h1 class="h4 mb-3">Change password</h1>
<form method="post" class="card card-body">
  <div class="mb-3"><label class="form-label">Current password</label><input class="form-control" type="password" name="current" required></div>
  <div class="mb-3"><label class="form-label">New password (min. 8 characters)</label><input class="form-control" type="password" name="new" minlength="8" required></div>
  <div class="mb-3"><label class="form-label">Confirm new password</label><input class="form-control" type="password" name="confirm" minlength="8" required></div>
  <button class="btn btn-primary">Save</button>
</form>
</div></div>
{% endblock %}
